<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>KAZAM</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="stylesheet" href="{{ asset('embed.css') }}">
<script>
  window.KAZAM_PUBLIC_BASE = {{ public_base|tojson }};
  window.KAZAM_EMBED_ID = {{ song_id|tojson }};
  window.KAZAM_EMBED_AUTOPLAY = {{ autoplay|tojson }};
</script>
</head>
<body>
  <div class="embed" id="card">
    <div class="art" id="art"></div>
    <div class="art-shade"></div>
    <div class="cover-wrap">
      <!-- loaded only for a song without a cover of its own -->
      <img class="cover-fallback" data-src="{{ asset('default-cover.webp') }}" alt="" hidden>
      <img class="cover" id="cover" alt="" hidden>
    </div>
    <div class="meta">
      <div class="t" id="title">加载中…</div>
      <div class="a" id="artist">KAZAM · 听音室</div>
      <div class="bar" id="bar"><i id="fill"></i></div>
    </div>
    <button type="button" class="play" id="btnPlay" aria-label="播放">
      <svg viewBox="0 0 24 24" id="iconPlay"><path d="M8.2 5.5v13a.85.85 0 0 0 1.3.72l10.2-6.5a.85.85 0 0 0 0-1.44L9.5 4.78a.85.85 0 0 0-1.3.72z"/></svg>
      <svg viewBox="0 0 24 24" id="iconPause" hidden><rect x="6.8" y="5.2" width="3.6" height="13.6" rx="0.9"/><rect x="13.6" y="5.2" width="3.6" height="13.6" rx="0.9"/></svg>
    </button>
    <a class="open" id="openFull" href="/" target="_blank" rel="noopener" title="打开完整听音室">
      <svg viewBox="0 0 40 40" width="12" height="12" aria-hidden="true">
        <rect x="12.2" y="9" width="2.4" height="22" fill="currentColor"/>
        <polygon points="16.2,20 27.5,9 30.5,9 19.2,20 30.8,31 27.8,31" fill="currentColor"/>
      </svg>
      <span>KAZAM ↗</span>
    </a>
  </div>
  <audio id="audio" preload="none"></audio>
  <script src="{{ asset('embed.js') }}" defer></script>
</body>
</html>
