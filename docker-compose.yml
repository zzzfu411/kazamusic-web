services:
  kazam:
    build: .
    container_name: kazam-music
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      PUBLIC_BASE_URL: "https://music.yeuxark.com"
      CORS_ORIGINS: "https://yeuxark.com,https://www.yeuxark.com,https://music.yeuxark.com"
      AUDIO_LEVEL: "exhigh"
      TRUST_PROXY: "true"
      CACHE_DIR: "/app/data/cache"
      LOG_LEVEL: "INFO"
    volumes:
      - kazam_cache:/app/data/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  kazam_cache:
