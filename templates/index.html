  window.KAZAM_DEFAULT_COVER = {{ asset('default-cover.webp')|tojson }};
  window.KAZAM_LOGO_URL = {{ asset('logo.webp')|tojson }};

<div class="backdrop" aria-hidden="true">
  <div class="backdrop-art" id="artA"></div>
  <div class="backdrop-art" id="artB"></div>
  <div class="backdrop-orb orb-1"></div>
  <div class="backdrop-orb orb-2"></div>
  <div class="backdrop-veil"></div>
  <div class="backdrop-grain"></div>
</div>

<header class="topbar">
  <a class="brand" href="/" id="logoBtn" aria-label="KAZAM" title="KAZAM · 连点 5 次进入管理员模式">
    <span class="brand-mark">
      <img src="{{ asset('logo.webp') }}" alt="" width="38" height="38" decoding="async">
    </span>
    <span class="brand-copy">
      <span class="brand-name">KAZAM</span>
      <span class="brand-tag">STUDIO PLAYER</span>
    </span>
  </a>

  <form class="search" id="searchForm" role="search" autocomplete="off">
    <svg class="icon search-icon"><use href="#i-search"/></svg>
    <input id="searchInput" type="search" enterkeyhint="search" spellcheck="false"
           placeholder="搜歌、歌手，或粘贴网易云链接 / ID" aria-label="搜索">
    <span class="search-badge" id="searchBadge" hidden>直链解析</span>
    <kbd class="search-key" aria-hidden="true">/</kbd>
  </form>

  <nav class="top-actions">
    <button type="button" class="pill pill-glow" id="btnRadio" title="随机探索今日精选曲目">
      <svg class="icon"><use href="#i-radio"/></svg><span>今日电台</span>
    </button>
    <button type="button" class="pill" id="btnLoadPl" title="导入网易云歌单链接或 ID">
      <svg class="icon"><use href="#i-list-plus"/></svg><span>导入歌单</span>
    </button>
    <button type="button" class="icon-btn hide-mobile" id="btnTheater" title="沉浸大屏模式 (F)" aria-label="沉浸大屏模式">
      <svg class="icon"><use href="#i-expand"/></svg>
    </button>
    <button type="button" class="icon-btn" id="btnSleep" title="睡眠定时关闭" aria-label="睡眠定时">
      <svg class="icon"><use href="#i-clock"/></svg>
      <span class="sleep-badge" id="sleepBadge" hidden></span>
    </button>
    <button type="button" class="icon-btn hide-mobile" id="btnShortcuts" title="快捷键与帮助 (?)" aria-label="快捷键与帮助">
      <svg class="icon"><use href="#i-keyboard"/></svg>
    </button>
    <button type="button" class="quota admin-only" id="chkszQuota" title="ChKSz 今日额度（点击刷新）">额度 --</button>
    <button type="button" class="icon-btn admin-only" id="btnUpstream" title="上游管理" aria-label="上游管理"><svg class="icon"><use href="#i-server"/></svg></button>
    <button type="button" class="icon-btn admin-only" id="btnAdminExit" title="退出管理员" aria-label="退出管理员"><svg class="icon"><use href="#i-logout"/></svg></button>
  </nav>
</header>

<main class="app">
  <section class="stage" id="stage" aria-label="正在播放">
    <div class="sheet-bar">
      <button type="button" class="icon-btn" id="btnSheetClose" aria-label="收起"><svg class="icon"><use href="#i-chevron-down"/></svg></button>
      <span class="sheet-label">NOW PLAYING</span>
      <button type="button" class="icon-btn" id="btnSheetLyrics" aria-label="歌词" aria-pressed="false"><svg class="icon"><use href="#i-lyrics"/></svg></button>
    </div>

    <div class="stage-top-bar hide-mobile">
      <div class="stage-status">
        <span class="status-dot"></span>
        <span id="stageSourceLabel">STUDIO DECK</span>
      </div>
      <div class="stage-switchers">
        <button type="button" class="stage-chip" id="btnVinylMode" title="切换黑胶唱盘 / 专辑画幅 (V)">
          <svg class="icon"><use href="#i-disc"/></svg>
          <span id="vinylModeLabel">黑胶唱机</span>
        </button>
      </div>
    </div>

    <div class="stage-visual">
      <div class="turntable-wrap" id="turntableWrap">
        <div class="cover-glow" id="coverGlow" aria-hidden="true"></div>
        <!-- Precision SVG Hi-Fi Tonearm -->
        <svg class="tonearm-svg" viewBox="0 0 120 220" aria-hidden="true">
          <defs>
            <linearGradient id="armMetal" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#e2e4ec"/>
              <stop offset="45%" stop-color="#8b8e9e"/>
              <stop offset="100%" stop-color="#383a47"/>
            </linearGradient>
            <radialGradient id="baseRing" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#353746"/>
              <stop offset="75%" stop-color="#171821"/>
              <stop offset="100%" stop-color="#0b0c12"/>
            </radialGradient>
          </defs>
          <circle cx="84" cy="36" r="24" fill="url(#baseRing)" stroke="rgba(255,255,255,0.16)" stroke-width="1.2"/>
          <circle cx="84" cy="36" r="14" fill="#1e202b" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
          <rect x="78" y="8" width="12" height="14" rx="3" fill="#2c2e3b" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
          <path d="M84 36 L82 118 Q81 148 64 174 L48 196" fill="none" stroke="url(#armMetal)" stroke-width="5.2" stroke-linecap="round"/>
          <path d="M54 188 L40 205 L47 210 L61 193 Z" fill="#f5b942" stroke="#15151e" stroke-width="1.2"/>
          <circle cx="84" cy="36" r="5" fill="#f5b942"/>
        </svg>

        <div class="cover" id="cover" title="点击切换歌词视图">
          <div class="vinyl-grooves" aria-hidden="true"></div>
          <img class="cover-default" src="{{ asset('default-cover.webp') }}" alt="" width="600" height="600" decoding="async">
          <img id="coverImg" alt="" width="600" height="600" decoding="async" referrerpolicy="no-referrer">
          <div class="vinyl-sheen" aria-hidden="true"></div>
          <div class="vinyl-spindle" aria-hidden="true"></div>
          <svg class="cover-ph icon"><use href="#i-note"/></svg>
        </div>
      </div>
      <div class="stage-lyrics" id="stageLyrics" hidden></div>
    </div>

    <!-- Real-time inline synchronized lyric line on the stage -->
    <button type="button" class="stage-lyric-ticker" id="npLyricTicker" title="点击展开同步歌词 (L)">
      <span class="ticker-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="ticker-text" id="npLyricLine">搜一首歌，开启高解析音乐之旅</span>
    </button>

    <div class="stage-deck">
      <div class="np">
        <div class="np-text">
          <h1 class="np-title" id="npTitle">KAZAM</h1>
          <p class="np-artist" id="npArtist" title="点击搜索该歌手">搜一首歌开始吧</p>
        </div>
        <div class="np-tags">
          <span class="tag" id="npQuality" hidden></span>
          <span class="tag admin-only" id="npCached" hidden>已缓存</span>
        </div>
      </div>

      <div class="progress">
        <div class="bar" id="progTrack" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="bar-buf" id="progBuf"></div>
          <div class="bar-fill" id="progFill"></div>
          <div class="bar-thumb" id="progThumb"></div>
          <span class="bar-HoverTip" id="progTip" hidden>0:00</span>
        </div>
        <div class="times"><span id="timeCur">0:00</span><span id="timeTot">0:00</span></div>
      </div>

      <div class="controls">
        <button type="button" class="icon-btn" id="btnMode" aria-label="播放方式：列表循环" title="列表循环"><svg class="icon"><use href="#i-repeat"/></svg></button>
        <button type="button" class="icon-btn big" id="btnPrev" aria-label="上一首" title="上一首 (←)"><svg class="icon"><use href="#i-prev"/></svg></button>
        <button type="button" class="play" id="btnPlay" aria-label="播放" title="播放 / 暂停 (Space)">
          <svg class="icon"><use href="#i-play"/></svg>
        </button>
        <button type="button" class="icon-btn big" id="btnNext" aria-label="下一首" title="下一首 (→)"><svg class="icon"><use href="#i-next"/></svg></button>
        <button type="button" class="icon-btn" id="btnLyrics" aria-label="歌词" title="歌词视图 (L)"><svg class="icon"><use href="#i-lyrics"/></svg></button>
      </div>

      <div class="stage-row">
        <div class="volume" id="volume">
          <button type="button" class="icon-btn small" id="btnVol" aria-label="静音" title="静音 (M)"><svg class="icon"><use href="#i-volume"/></svg></button>
          <input type="range" id="volSlider" min="0" max="100" value="70" step="1" aria-label="音量">
        </div>
        <label class="level" title="选择音频解析音质">
          <span class="sr-only">音质</span>
          <select id="audioLevel" aria-label="音质">
            <option value="standard">标准 128k</option>
            <option value="higher">较高 192k</option>
            <option value="exhigh" selected>极高 320k</option>
            <option value="lossless">无损 FLAC</option>
            <option value="hires">Hi-Res 金标</option>
            <option value="jymaster">臻品母带</option>
          </select>
        </label>
      </div>

      <div class="np-actions" id="npActions" hidden>
        <button type="button" class="ghost" id="btnDlSong"><svg class="icon"><use href="#i-download"/></svg><span>下载音频</span></button>
        <button type="button" class="ghost" id="btnDlLyric"><svg class="icon"><use href="#i-file"/></svg><span>下载歌词</span></button>
        <button type="button" class="ghost" id="btnShare"><svg class="icon"><use href="#i-share"/></svg><span>分享</span></button>
        <button type="button" class="ghost admin-only" id="btnCopyUrl"><svg class="icon"><use href="#i-link"/></svg><span>流地址</span></button>
        <button type="button" class="ghost admin-only" id="btnCacheSong"><svg class="icon"><use href="#i-cloud"/></svg><span>缓存入库</span></button>
      </div>
    </div>
  </section>

  <section class="panel" aria-label="歌曲列表">
    <div class="panel-head">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-view="search" aria-selected="true">探索发现</button>
        <button type="button" role="tab" data-view="playlist" aria-selected="false">我的列表<i id="countMy"></i></button>
        <button type="button" role="tab" data-view="radio" aria-selected="false">今日电台<i id="countRadio"></i></button>
        <button type="button" role="tab" data-view="lyrics" aria-selected="false">同步歌词</button>
        <button type="button" role="tab" data-view="library" aria-selected="false" class="admin-only">云端曲库</button>
      </div>
      <div class="panel-tools">
        <div class="filter-box" data-for="playlist radio library" hidden>
          <svg class="icon"><use href="#i-search"/></svg>
          <input type="search" id="listFilter" placeholder="筛选列表…" autocomplete="off" aria-label="筛选当前列表">
        </div>
        <button type="button" class="tool" data-for="playlist" id="btnImportPl" title="从 JSON 文件导入"><svg class="icon"><use href="#i-upload"/></svg><span>导入</span></button>
        <div class="tool-wrap" data-for="playlist radio">
          <button type="button" class="tool" id="btnExportPl" aria-haspopup="menu" aria-expanded="false"><svg class="icon"><use href="#i-download"/></svg><span>导出</span></button>
          <div class="pop" id="exportMenu" role="menu" hidden>
            <button type="button" role="menuitem" data-export="json">JSON 备份（可再导入）</button>
            <button type="button" role="menuitem" data-export="m3u">M3U 播放列表</button>
            <button type="button" role="menuitem" data-export="txt">纯文本曲目单</button>
          </div>
        </div>
        <button type="button" class="tool" data-for="playlist" id="btnClearPl"><svg class="icon"><use href="#i-trash"/></svg><span>清空</span></button>
        <button type="button" class="tool" data-for="radio" id="btnReloadRadio"><svg class="icon"><use href="#i-refresh"/></svg><span>换一批</span></button>
        <button type="button" class="tool" data-for="radio" id="btnClearRadio"><svg class="icon"><use href="#i-trash"/></svg><span>清空</span></button>
        <button type="button" class="tool" data-for="library" id="btnRefreshLib"><svg class="icon"><use href="#i-refresh"/></svg><span>刷新</span></button>
      </div>
    </div>
    <div class="panel-sub-bar">
      <p class="panel-sub" id="panelSub"></p>
      <div class="panel-batch" id="panelBatch" hidden>
        <button type="button" class="batch-btn primary" id="btnPlayAll"><svg class="icon"><use href="#i-play"/></svg><span>播放全部</span></button>
        <button type="button" class="batch-btn" id="btnAddAll"><svg class="icon"><use href="#i-plus"/></svg><span>全部加入列表</span></button>
      </div>
    </div>
    <div class="panel-body" id="panelBody">
      <div class="view" data-view="search" id="viewSearch"></div>
      <div class="view" data-view="playlist" id="viewPlaylist" hidden></div>
      <div class="view" data-view="radio" id="viewRadio" hidden></div>
      <div class="view view-lyrics" data-view="lyrics" id="viewLyrics" hidden><div class="lyrics" id="lyrics"></div></div>
      <div class="view" data-view="library" id="viewLibrary" hidden></div>
    </div>
  </section>
</main>

<div class="mini" id="mini" hidden>
  <div class="mini-prog"><i id="miniFill"></i></div>
  <button type="button" class="mini-open" id="miniOpen" aria-label="打开正在播放">
    <span class="mini-cover"><img id="miniCover" alt="" width="44" height="44" decoding="async" referrerpolicy="no-referrer"></span>
    <span class="mini-text"><b id="miniTitle"></b><small id="miniArtist"></small></span>
  </button>
  <button type="button" class="icon-btn" id="miniPlay" aria-label="播放"><svg class="icon"><use href="#i-play"/></svg></button>
  <button type="button" class="icon-btn" id="miniNext" aria-label="下一首"><svg class="icon"><use href="#i-next"/></svg></button>
</div>

<div class="menu" id="rowMenu" role="menu" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="dialog" id="dlg">
  <form method="dialog" class="dialog-body" id="dlgForm">
    <h2 class="dialog-title" id="dlgTitle"></h2>
    <p class="dialog-desc" id="dlgDesc"></p>
    <input class="field" id="dlgInput" autocomplete="off">
    <div class="dialog-actions" id="dlgActions"></div>
  </form>
</dialog>

<dialog class="dialog wide" id="dlgUpstream" aria-labelledby="upTitle">
  <div class="dialog-body">
    <div class="dialog-head">
      <h2 class="dialog-title" id="upTitle">上游 API 管理</h2>
      <button type="button" class="icon-btn" id="upClose" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <p class="dialog-desc">测活从本 VPS 访问上游（与浏览器网络无关）。可增删自定义源，切换立即生效。</p>
    <div class="up-toolbar">
      <button type="button" class="btn primary" id="upBtnProbe"><svg class="icon"><use href="#i-zap"/></svg>测速 / 测活</button>
      <button type="button" class="btn" id="upBtnShowAdd"><svg class="icon"><use href="#i-plus"/></svg>添加源</button>
      <span class="up-status" id="upProbeStatus">尚未测速</span>
    </div>
    <div class="up-quota"><span>ChKSz 额度</span><strong id="upQuotaText">今日已用 -- / 剩余 --</strong><button type="button" class="btn small" id="upQuotaRefresh">刷新</button></div>
    <form class="up-add" id="upAddForm" hidden>
      <label>名称<input class="field" id="upAddName" placeholder="例如 Meting 备用2" maxlength="40"></label>
      <label>类型
        <select class="field" id="upAddKind">
          <option value="meting">Meting 协议</option>
          <option value="chksz">chksz 风格</option>
          <option value="ors">ORS 无损（QQ/酷狗/酷我/咪咕）</option>
        </select>
      </label>
      <label class="span2">Endpoint URL<input class="field" id="upAddEndpoint" type="url" placeholder="https://example.com/meting/" maxlength="200"></label>
      <label class="span2">备注（可选）<input class="field" id="upAddDesc" placeholder="来源说明" maxlength="120"></label>
      <div class="span2 up-add-actions">
        <button type="button" class="btn primary" id="upBtnAdd">确认添加</button>
        <button type="button" class="btn" id="upBtnAddCancel">取消</button>
      </div>
    </form>
    <div class="up-list" id="upList"></div>
    <p class="up-foot" id="upRecommend"></p>
  </div>
</dialog>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<audio id="audio" preload="auto"></audio>
<script src="{{ asset('app.js') }}" defer></script>
</body>
</html>
