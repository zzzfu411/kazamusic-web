<script>
  // the saved theme goes on before the first paint (app.js runs last)
  try {
    (function (t) {
      var bg = { obsidian: "#111110", washi: "#f2eee6", walnut: "#151210", celadon: "#0f1312", vermilion: "#131111" }[t];
      if (!bg) return;
      document.documentElement.setAttribute("data-theme", t);
      document.getElementById("metaThemeColor").setAttribute("content", bg);
    })(localStorage.getItem("kazam.theme"));
  } catch (e) {}
</script>

</script>

      <button type="button" class="icon-btn" id="btnSheetLyrics" aria-label="歌词" aria-pressed="false"><svg class="icon"><use href="#i-lyrics"/></svg></button>
    </div>

    <div class="stage-top-bar hide-mobile">
      <div class="stage-status">
        <span class="status-dot"></span>
        <span id="stageSourceLabel">SIDE A · STANDBY</span>
      </div>
      <button type="button" class="stage-mode-link" id="btnVinylMode" title="切换黑胶唱机 / 封套画幅 (V)">
        <svg class="icon"><use href="#i-disc"/></svg>
        <span id="vinylModeLabel">黑胶唱盘</span>
      </button>
    </div>

    <div class="stage-visual">
      <div class="turntable-wrap" id="turntableWrap">
        <div class="cover-glow" id="coverGlow" aria-hidden="true"></div>
        <!-- Precision Minimalist Brushed-Titanium Tonearm (Pivot at 84,36) -->
        <svg class="tonearm-svg" viewBox="0 0 120 220" aria-hidden="true">
          <defs>
            <linearGradient id="armTube" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#8f8b84"/>
              <stop offset="48%" stop-color="#dedad0"/>
              <stop offset="100%" stop-color="#5c5953"/>
            </linearGradient>
            <linearGradient id="cwMetal" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#3c3a37"/>
              <stop offset="50%" stop-color="#7a766e"/>
              <stop offset="100%" stop-color="#282624"/>
            </linearGradient>
          </defs>
          <!-- Gimbal Bearing Base -->
          <circle cx="84" cy="36" r="20" fill="#171615" stroke="rgba(235,230,220,0.16)" stroke-width="0.9"/>
          <circle cx="84" cy="36" r="11.5" fill="#22211f" stroke="rgba(235,230,220,0.22)" stroke-width="0.8"/>
          <!-- Rear Shaft & Cylindrical Counterweight -->
          <line x1="84" y1="36" x2="84" y2="8" stroke="#9e9990" stroke-width="3" stroke-linecap="round"/>
          <rect x="74.5" y="9" width="19" height="10.5" rx="1.8" fill="url(#cwMetal)" stroke="rgba(235,230,220,0.24)" stroke-width="0.7"/>
          <line x1="75.5" y1="14.2" x2="92.5" y2="14.2" stroke="rgba(235,230,220,0.28)" stroke-width="0.6"/>
          <!-- Slender Precision Tonearm Tube -->
          <path d="M84 36 L82 118 Q81 148 64 174 L48.5 196" fill="none" stroke="url(#armTube)" stroke-width="3.4" stroke-linecap="round"/>
          <!-- Finger Lift Wire -->
          <path d="M55 191 Q61 194 60 200" fill="none" stroke="#c8c3b8" stroke-width="1" stroke-linecap="round"/>
          <!-- Matte Carbon Headshell & Stylus -->
          <path d="M54 188.5 L40.5 205.5 L46.8 210 L60.2 193 Z" fill="#1d1c1a" stroke="rgba(235,230,220,0.34)" stroke-width="0.85"/>
          <line x1="48.8" y1="196.5" x2="44.2" y2="202.3" stroke="#e5dfd3" stroke-width="1.1" stroke-linecap="round"/>
          <!-- Gimbal Pivot Cap -->
          <circle cx="84" cy="36" r="3.2" fill="#d8d2c6"/>
        </svg>

        <div class="cover" id="cover" title="点击切换同步歌词视图 (L)">
          <div class="vinyl-grooves" aria-hidden="true"></div>
          <img class="cover-default" src="{{ asset('default-cover.webp') }}" alt="" width="600" height="600" decoding="async">
          <img id="coverImg" alt="" width="600" height="600" decoding="async" referrerpolicy="no-referrer">
          <div class="vinyl-spindle" aria-hidden="true"></div>
          <svg class="cover-ph icon"><use href="#i-note"/></svg>
        </div>
        <!-- light falls on the record from one place, so the shine stays while the record turns -->
        <div class="vinyl-glare" aria-hidden="true"></div>
        <div class="vinyl-sheen" aria-hidden="true"></div>
      </div>
      <div class="stage-lyrics" id="stageLyrics" hidden></div>
    </div>

    <div class="stage-deck">
      <div class="np">
        <div class="np-text">
          <h1 class="np-title" id="npTitle">KAZAM</h1>
          <div class="np-subline">
            <p class="np-artist" id="npArtist" title="点击检索该音乐人">静候选曲</p>
            <span class="np-tags">
              <span class="tag" id="npQuality" hidden></span>
              <span class="tag admin-only" id="npCached" hidden>LOCAL</span>
            </span>
          </div>
        </div>
      </div>

      <!-- Quiet editorial epigraph lyric line (no pill box) -->
      <button type="button" class="stage-lyric-ticker" id="npLyricTicker" title="点击展开完整同步歌词 (L)">
        <span class="ticker-wave" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="ticker-text" id="npLyricLine">搜一首歌，或自右侧选辑开启聆听</span>
      </button>

      <div class="progress">
        <div class="bar" id="progTrack" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="bar-buf" id="progBuf"></div>
          <div class="bar-fill" id="progFill"></div>
          <div class="bar-thumb" id="progThumb"></div>
          <span class="bar-HoverTip" id="progTip" hidden>0:00</span>
        </div>
        <div class="times"><span id="timeCur">0:00</span><span id="timeTot">0:00</span></div>
      </div>

      <div class="controls">
        <button type="button" class="icon-btn" id="btnMode" aria-label="播放方式：列表循环" title="列表循环"><svg class="icon"><use href="#i-repeat"/></svg></button>
        <button type="button" class="icon-btn big" id="btnPrev" aria-label="上一首" title="上一首 (←)"><svg class="icon"><use href="#i-prev"/></svg></button>
        <button type="button" class="play" id="btnPlay" aria-label="播放" title="播放 / 暂停 (Space)">
          <svg class="icon"><use href="#i-play"/></svg>
        </button>
        <button type="button" class="icon-btn big" id="btnNext" aria-label="下一首" title="下一首 (→)"><svg class="icon"><use href="#i-next"/></svg></button>
        <button type="button" class="icon-btn" id="btnLyrics" aria-label="歌词" title="歌词视图 (L)"><svg class="icon"><use href="#i-lyrics"/></svg></button>
      </div>

      <div class="stage-row">
        <div class="volume" id="volume">
          <button type="button" class="icon-btn small" id="btnVol" aria-label="静音" title="静音 (M)"><svg class="icon"><use href="#i-volume"/></svg></button>
          <input type="range" id="volSlider" min="0" max="100" value="70" step="1" aria-label="音量">
        </div>
        <div class="stage-meta-tools">
          <label class="level" title="音频解析规格">
            <span class="sr-only">音质</span>
            <span class="level-text" id="audioLevelText" aria-hidden="true">极高 320k</span>
            <svg class="icon level-caret" aria-hidden="true"><use href="#i-chevron-down"/></svg>
            <select id="audioLevel" aria-label="音质">
              <option value="standard">标准 128k</option>
              <option value="higher">较高 192k</option>
              <option value="exhigh" selected>极高 320k</option>
              <option value="lossless">无损 FLAC</option>
              <option value="hires">Hi-Res</option>
              <option value="jymaster">臻品母带</option>
            </select>
          </label>
          <div class="track-more-wrap" id="trackMoreWrap" hidden>
            <button type="button" class="icon-btn small" id="btnTrackMore" title="曲目操作与下载" aria-label="曲目操作" aria-expanded="false">
              <svg class="icon"><use href="#i-more"/></svg>
            </button>
            <div class="pop track-pop" id="npActions" role="menu" hidden>
              <button type="button" role="menuitem" id="btnDlSong"><svg class="icon"><use href="#i-download"/></svg><span>下载当前音频</span></button>
              <button type="button" role="menuitem" id="btnDlLyric"><svg class="icon"><use href="#i-file"/></svg><span>下载 LRC 歌词</span></button>
              <button type="button" role="menuitem" id="btnShare"><svg class="icon"><use href="#i-share"/></svg><span>复制分享链接</span></button>
              <button type="button" role="menuitem" class="admin-only" id="btnCopyUrl"><svg class="icon"><use href="#i-link"/></svg><span>复制稳定流地址</span></button>
              <button type="button" role="menuitem" class="admin-only" id="btnCacheSong"><svg class="icon"><use href="#i-cloud"/></svg><span>缓存至服务器</span></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="panel" aria-label="选辑与曲目单">
    <button type="button" class="icon-btn theater-exit" id="btnTheaterExit" title="退出沉浸模式 (F / Esc)" aria-label="退出沉浸模式"><svg class="icon"><use href="#i-collapse"/></svg></button>
    <div class="panel-head">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-view="search" aria-selected="true">选辑探索</button>
        <button type="button" role="tab" data-view="playlist" aria-selected="false">我的列表<i id="countMy"></i></button>
        <button type="button" role="tab" data-view="radio" aria-selected="false">今日电台<i id="countRadio"></i></button>
        <button type="button" role="tab" data-view="lyrics" aria-selected="false">同步歌词</button>
        <button type="button" role="tab" data-view="library" aria-selected="false" class="admin-only">云端曲库</button>
      </div>
      <div class="panel-tools">
        <div class="filter-box" data-for="playlist radio library" hidden>
          <svg class="icon"><use href="#i-search"/></svg>
          <input type="search" id="listFilter" placeholder="筛选曲目…" autocomplete="off" aria-label="筛选当前列表">
        </div>
        <button type="button" class="tool" hidden data-for="playlist" id="btnImportPl" title="从 JSON 文件导入"><svg class="icon"><use href="#i-upload"/></svg><span>导入</span></button>
        <div class="tool-wrap" hidden data-for="playlist radio">
          <button type="button" class="tool" id="btnExportPl" aria-haspopup="menu" aria-expanded="false"><svg class="icon"><use href="#i-download"/></svg><span>导出</span></button>
          <div class="pop" id="exportMenu" role="menu" hidden>
            <button type="button" role="menuitem" data-export="json">JSON 备份（可再导入）</button>
            <button type="button" role="menuitem" data-export="m3u">M3U 播放列表</button>
            <button type="button" role="menuitem" data-export="txt">纯文本曲目单</button>
          </div>
        </div>
        <button type="button" class="tool" hidden data-for="playlist" id="btnClearPl"><svg class="icon"><use href="#i-trash"/></svg><span>清空</span></button>
        <button type="button" class="tool" hidden data-for="radio" id="btnReloadRadio"><svg class="icon"><use href="#i-refresh"/></svg><span>换一批</span></button>
        <button type="button" class="tool" hidden data-for="radio" id="btnClearRadio"><svg class="icon"><use href="#i-trash"/></svg><span>清空</span></button>
        <button type="button" class="tool" hidden data-for="library" id="btnRefreshLib"><svg class="icon"><use href="#i-refresh"/></svg><span>刷新</span></button>
      </div>
    </div>
    <div class="panel-sub-bar">
      <p class="panel-sub" id="panelSub"></p>
      <div class="panel-batch" id="panelBatch" hidden>
        <button type="button" class="batch-btn primary" id="btnPlayAll"><svg class="icon"><use href="#i-play"/></svg><span>播放全部</span></button>
        <button type="button" class="batch-btn" id="btnAddAll"><svg class="icon"><use href="#i-plus"/></svg><span>全部加入列表</span></button>
      </div>
    </div>
    <div class="panel-body" id="panelBody">
      <div class="view" data-view="search" id="viewSearch"></div>
      <div class="view" data-view="playlist" id="viewPlaylist" hidden></div>
      <div class="view" data-view="radio" id="viewRadio" hidden></div>
      <div class="view view-lyrics" data-view="lyrics" id="viewLyrics" hidden><div class="lyrics" id="lyrics"></div></div>
      <div class="view" data-view="library" id="viewLibrary" hidden></div>
    </div>
  </section>
</main>

<div class="mini" id="mini" hidden>
  <div class="mini-prog"><i id="miniFill"></i></div>
  <button type="button" class="mini-open" id="miniOpen" aria-label="打开正在播放">
    <span class="mini-cover"><img id="miniCover" alt="" width="42" height="42" decoding="async" referrerpolicy="no-referrer"></span>
    <span class="mini-text"><b id="miniTitle"></b><small id="miniArtist"></small></span>
  </button>
  <button type="button" class="icon-btn" id="miniPlay" aria-label="播放"><svg class="icon"><use href="#i-play"/></svg></button>
  <button type="button" class="icon-btn" id="miniNext" aria-label="下一首"><svg class="icon"><use href="#i-next"/></svg></button>
</div>

<div class="menu" id="rowMenu" role="menu" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="dialog" id="dlg">
  <form method="dialog" class="dialog-body" id="dlgForm">
    <h2 class="dialog-title" id="dlgTitle"></h2>
    <p class="dialog-desc" id="dlgDesc"></p>
    <input class="field" id="dlgInput" autocomplete="off">
    <div class="dialog-actions" id="dlgActions"></div>
  </form>
</dialog>

<dialog class="dialog wide" id="dlgUpstream" aria-labelledby="upTitle">
  <div class="dialog-body">
    <div class="dialog-head">
      <h2 class="dialog-title" id="upTitle">上游音源管理</h2>
      <button type="button" class="icon-btn" id="upClose" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <p class="dialog-desc">测活从本 VPS 访问上游（与浏览器网络无关）。可增删自定义源，切换立即生效。</p>
    <div class="up-toolbar">
      <button type="button" class="btn primary" id="upBtnProbe"><svg class="icon"><use href="#i-zap"/></svg>测速 / 测活</button>
      <button type="button" class="btn" id="upBtnShowAdd"><svg class="icon"><use href="#i-plus"/></svg>添加源</button>
      <span class="up-status" id="upProbeStatus">尚未测速</span>
    </div>
    <div class="up-quota"><span>ChKSz 额度</span><strong id="upQuotaText">今日已用 -- / 剩余 --</strong><button type="button" class="btn small" id="upQuotaRefresh">刷新</button></div>
    <form class="up-add" id="upAddForm" hidden>
      <label>名称<input class="field" id="upAddName" placeholder="例如 Meting 备用2" maxlength="40"></label>
      <label>类型
        <select class="field" id="upAddKind">
          <option value="meting">Meting 协议</option>
          <option value="chksz">chksz 风格</option>
          <option value="ors">ORS 无损（QQ/酷狗/酷我/咪咕）</option>
          <option value="gd">GD音乐台</option>
          <option value="hi">无损下载 flac.music.hi.cn</option>
        </select>
      </label>
      <label id="upAddPlatformWrap" hidden>平台
        <select class="field" id="upAddPlatform">
          <option value="netease" data-kind="gd">网易云</option>
          <option value="tencent" data-kind="gd">QQ</option>
          <option value="kuwo" data-kind="gd hi">酷我</option>
          <option value="wyy" data-kind="hi">网易云（无损站）</option>
          <option value="qobuz" data-kind="gd">Qobuz</option>
          <option value="joox" data-kind="gd">JOOX</option>
          <option value="migu" data-kind="gd">咪咕</option>
        </select>
      </label>
      <label class="span2">Endpoint URL<input class="field" id="upAddEndpoint" type="url" placeholder="https://example.com/meting/" maxlength="200"></label>
      <label class="span2">备注（可选）<input class="field" id="upAddDesc" placeholder="来源说明" maxlength="120"></label>
      <div class="span2 up-add-actions">
        <button type="button" class="btn primary" id="upBtnAdd">确认添加</button>
        <button type="button" class="btn" id="upBtnAddCancel">取消</button>
      </div>
    </form>
    <div class="up-list" id="upList"></div>
    <p class="up-foot" id="upRecommend"></p>
  </div>
</dialog>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<audio id="audio" preload="auto"></audio>
<script src="{{ asset('app.js') }}" defer></script>
